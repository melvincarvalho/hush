<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <title>Hush</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #000;
      color: #fff;
      height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 { 
      font-size: 48px; 
      margin: 20px 0;
    }
    .key-box {
      background: #111;
      padding: 15px;
      border-radius: 12px;
      font-family: monospace;
      word-break: break-all;
      margin: 20px 0;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #111;
      border: 2px solid #333;
      color: #fff;
      font-size: 16px;
      padding: 15px;
      border-radius: 12px;
      resize: none;
    }
    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      margin: 10px 0;
    }
    button:active {
      opacity: 0.7;
    }
    .success {
      background: #00ff0040;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin: 10px 0;
    }
    .messages {
      margin: 20px 0;
      max-height: 300px;
      overflow-y: auto;
    }
    .message {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      margin: 12px 0;
      padding: 0;
      position: relative;
      transition: all 0.2s;
      overflow: hidden;
    }
    .message:hover {
      border-color: #333;
      background: #161616;
    }
    .message-header {
      padding: 10px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .message-time {
      color: #666;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .message-content {
      padding: 16px;
      font-size: 15px;
      line-height: 1.5;
      color: #e0e0e0;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .message-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .message:hover .message-actions {
      opacity: 1;
    }
    .copy-btn {
      background: transparent;
      color: #888;
      border: 1px solid #333;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .copy-btn:hover {
      background: #222;
      color: #fff;
      border-color: #444;
    }
    .copy-btn.copied {
      background: #0f380f;
      color: #0f0;
      border-color: #0f0;
    }
    .refresh-btn {
      background: #333;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin: 10px 0;
      cursor: pointer;
    }
    
    /* QR Code Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: #111;
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
    }
    
    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 30px;
      color: #666;
      cursor: pointer;
    }
    
    .close-modal:hover {
      color: #fff;
    }
    
    #qrcode {
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
    }
    
    #qr-video {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
    }
    
    .qr-buttons {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }
    
    .qr-btn {
      flex: 1;
      background: #222;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .qr-btn:hover {
      background: #333;
    }
    
    .scan-result {
      margin-top: 20px;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤫 Hush</h1>
    
    <div class="key-box" id="key">Loading...</div>
    <div style="text-align: center; color: #444; font-size: 10px; margin: -10px 0 10px;">
      v3.1.0 
      <span id="updateCheck" style="cursor: pointer; text-decoration: underline; margin-left: 10px;">check update</span>
    </div>
    
    <textarea id="msg" placeholder="Paste or type something..."></textarea>
    
    <button id="sendBtn">HUSH IT</button>
    
    <div class="qr-buttons">
      <button class="qr-btn" id="showQrBtn">📱 SHOW QR</button>
      <button class="qr-btn" id="scanQrBtn">📷 SCAN QR</button>
    </div>
    
    <button id="copyBtn" style="background:#222; color:#fff;">COPY KEY</button>
    <button id="importBtn" style="background:#444; color:#fff;">IMPORT KEY</button>
    
    <div id="status"></div>
    
    <button id="refreshBtn" class="refresh-btn">↻ REFRESH MESSAGES</button>
    <div id="messages" class="messages"></div>
    
    <div id="installPrompt" style="display:none; background:#333; padding:15px; border-radius:12px; margin:10px 0; text-align:center;">
      <div style="margin-bottom:10px;">📱 Install Hush as an app</div>
      <button id="installBtn" style="background:#fff; color:#000; padding:10px 20px; border:none; border-radius:8px;">Install Now</button>
      <button id="dismissPrompt" style="background:transparent; color:#666; border:1px solid #666; padding:10px 20px; border-radius:8px; margin-left:10px;">Not Now</button>
    </div>
  </div>
  
  <!-- QR Code Modal -->
  <div id="qrModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="closeQr">&times;</span>
      <h3>Your Private Key QR Code</h3>
      <div id="qrcode"></div>
      <p style="color:#888; font-size:14px; margin-top:20px;">
        Scan this QR code on another device to sync your clipboard
      </p>
    </div>
  </div>
  
  <!-- QR Scanner Modal -->
  <div id="scanModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="closeScan">&times;</span>
      <h3>Scan QR Code</h3>
      <video id="qr-video"></video>
      <div id="scan-result" class="scan-result" style="display:none;">
        <p>Scanned key:</p>
        <div id="scanned-key"></div>
        <button id="importScannedBtn" style="margin-top:15px; width:100%; padding:12px; background:#fff; color:#000; border:none; border-radius:8px; font-weight:600;">
          Import This Key
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.7.0/lib/nostr.bundle.js" crossorigin="anonymous" onerror="console.error('Failed to load nostr-tools')"></script>
  <script>
  // Track original JSON.parse before override
  const originalParse = JSON.parse;
  
  // Only log parse errors, don't prevent them
  window.addEventListener('error', function(e) {
    if (e.message && e.message.includes('JSON.parse')) {
      console.log('JSON parse error caught:', e.message);
      // Check if it's from the nostr-tools library
      if (e.filename && e.filename.includes('nostr')) {
        console.log('Error is from nostr-tools library, ignoring...');
        e.preventDefault();
        return false;
      }
    }
  }, true);
  
  // Wait for nostr-tools to load
  window.addEventListener('DOMContentLoaded', function() {
    // Check if NostrTools loaded
    if (!window.NostrTools) {
      console.error('NostrTools not loaded');
      document.getElementById('key').textContent = 'Error: NostrTools library failed to load';
      return;
    }
    
    // Utility functions for hex conversion
    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }
    
    // Get or create key
    let skHex, sk, pk;
    try {
      skHex = localStorage.getItem('hush_key');
      if (!skHex || skHex.length !== 64) {
        // Generate new key if none exists or invalid
        sk = window.NostrTools.generateSecretKey();
        skHex = bytesToHex(sk);
        localStorage.setItem('hush_key', skHex);
      } else {
        sk = hexToBytes(skHex);
      }
      pk = window.NostrTools.getPublicKey(sk);
    } catch (e) {
      console.error('Key initialization error:', e);
      // Generate new key on error
      sk = window.NostrTools.generateSecretKey();
      skHex = bytesToHex(sk);
      try {
        localStorage.setItem('hush_key', skHex);
      } catch (storageError) {
        console.error('Storage error:', storageError);
      }
      pk = window.NostrTools.getPublicKey(sk);
    }
    
    // Display key (truncated) and public key
    document.getElementById('key').innerHTML = 
      'Private: ' + skHex.slice(0, 12) + '...' + skHex.slice(-6) + '<br>' +
      'Public: ' + pk.slice(0, 16) + '...';
    
    // Auto-focus textarea
    document.getElementById('msg').focus();
    
    // Manual update check
    document.getElementById('updateCheck').onclick = async function() {
      this.textContent = 'checking...';
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) {
          await reg.update();
          // Force reload with cache bypass
          setTimeout(() => {
            window.location.reload(true);
          }, 1000);
        }
      }
    };
    
    // Attach event listeners
    document.getElementById('sendBtn').onclick = send;
    document.getElementById('copyBtn').onclick = copyKey;
    document.getElementById('importBtn').onclick = importKey;
    document.getElementById('refreshBtn').onclick = fetchMessages;
    document.getElementById('showQrBtn').onclick = showQrCode;
    document.getElementById('scanQrBtn').onclick = startQrScan;
    
    // Initialize SimplePool for fetching
    const pool = new window.NostrTools.SimplePool();
    
    // Time ago helper
    function getTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
      
      return date.toLocaleDateString();
    }
    
    // QR Code Functions
    let qrScanner = null;
    
    function showQrCode() {
      const modal = document.getElementById('qrModal');
      modal.style.display = 'flex';
      
      // Clear any existing QR code
      document.getElementById('qrcode').innerHTML = '';
      
      // Generate QR code with the private key
      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById('qrcode'), {
          text: skHex,
          width: 256,
          height: 256,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.L
        });
      } else {
        document.getElementById('qrcode').innerHTML = '<p style="color:#f00;">QR library failed to load</p>';
      }
    }
    
    async function startQrScan() {
      const modal = document.getElementById('scanModal');
      modal.style.display = 'flex';
      
      const video = document.getElementById('qr-video');
      const scanResult = document.getElementById('scan-result');
      scanResult.style.display = 'none';
      
      try {
        // Check if QrScanner is available
        if (typeof QrScanner === 'undefined') {
          throw new Error('QR Scanner library not loaded');
        }
        
        // Set worker path for QrScanner
        QrScanner.WORKER_PATH = 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner-worker.min.js';
        
        // Initialize scanner if not already done
        if (!qrScanner) {
          qrScanner = new QrScanner(
            video,
            result => {
              // Successfully scanned
              handleQrScanResult(result.data);
            },
            {
              highlightScanRegion: true,
              highlightCodeOutline: true,
            }
          );
        }
        
        // Start scanning
        await qrScanner.start();
        
      } catch (error) {
        console.error('QR scan error:', error);
        alert('Camera access denied or not available. You can still import keys manually.');
        modal.style.display = 'none';
      }
    }
    
    function handleQrScanResult(data) {
      // Validate if it's a valid private key (64 hex chars)
      if (/^[0-9a-fA-F]{64}$/.test(data)) {
        // Stop scanning
        if (qrScanner) {
          qrScanner.stop();
        }
        
        // Show the scanned result
        const scanResult = document.getElementById('scan-result');
        const scannedKey = document.getElementById('scanned-key');
        
        scannedKey.textContent = data.slice(0, 12) + '...' + data.slice(-6);
        scanResult.style.display = 'block';
        
        // Store scanned key temporarily
        window.tempScannedKey = data;
        
      } else {
        // Not a valid key, keep scanning
        console.log('Invalid QR content, continuing scan...');
      }
    }
    
    // Modal close handlers
    document.getElementById('closeQr').onclick = function() {
      document.getElementById('qrModal').style.display = 'none';
    };
    
    document.getElementById('closeScan').onclick = function() {
      document.getElementById('scanModal').style.display = 'none';
      if (qrScanner) {
        qrScanner.stop();
      }
    };
    
    // Import scanned key handler
    document.getElementById('importScannedBtn').onclick = function() {
      if (window.tempScannedKey) {
        localStorage.setItem('hush_key', window.tempScannedKey);
        location.reload();
      }
    };
    
    // Click outside modal to close
    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
        if (qrScanner && event.target.id === 'scanModal') {
          qrScanner.stop();
        }
      }
    };
    
    // Auto-fetch messages on load
    fetchMessages();
    
    // Handle shared text from Android share intent
    const urlParams = new URLSearchParams(window.location.search);
    const sharedText = urlParams.get('shared_text');
    if (sharedText) {
      document.getElementById('msg').value = sharedText;
      document.getElementById('msg').focus();
      // Clear the URL parameter
      window.history.replaceState({}, document.title, window.location.pathname);
    }
    
    async function send() {
      const msg = document.getElementById('msg').value;
      if (!msg) return;
      
      const button = document.getElementById('sendBtn');
      // Disable button
      button.disabled = true;
      button.textContent = 'SENDING...';
      
      try {
        // Encrypt to self (NIP-04)
        const encrypted = await window.NostrTools.nip04.encrypt(sk, pk, msg);
        
        // Create unsigned event
        const unsignedEvent = {
          kind: 31337,
          created_at: Math.floor(Date.now() / 1000),
          tags: [['p', pk], ['hush', '1']],
          content: encrypted,
          pubkey: pk
        };
        
        // Finalize event (signs it and adds id)
        const signedEvent = window.NostrTools.finalizeEvent(unsignedEvent, sk);
        
        // Send to relays (parallel)
        const relays = [
          'wss://relay.damus.io',
          'wss://nos.lol',
          'wss://relay.primal.net'
        ];
        
        await Promise.any(relays.map(async url => {
          const relay = await window.NostrTools.Relay.connect(url);
          await relay.publish(signedEvent);
          relay.close();
        }));
        
        // Success!
        document.getElementById('msg').value = '';
        document.getElementById('status').innerHTML = 
          '<div class="success">✓ Hushed!</div>';
        
        setTimeout(() => {
          document.getElementById('status').innerHTML = '';
        }, 2000);
        
      } catch(e) {
        alert('Failed to send: ' + e.message);
      }
      
      // Re-enable button
      button.disabled = false;
      button.textContent = 'HUSH IT';
    }
    
    function copyKey() {
      navigator.clipboard.writeText(skHex);
      document.getElementById('status').innerHTML = 
        '<div class="success">Key copied!</div>';
      setTimeout(() => {
        document.getElementById('status').innerHTML = '';
      }, 2000);
    }
    
    function importKey() {
      const newKey = prompt('Enter your private key (64 hex characters):');
      if (!newKey) return;
      
      // Validate hex key
      if (!/^[0-9a-fA-F]{64}$/.test(newKey)) {
        alert('Invalid private key. Must be 64 hex characters.');
        return;
      }
      
      // Save and reload
      localStorage.setItem('hush_key', newKey);
      location.reload();
    }
    
    // Handle paste with Cmd/Ctrl+V
    document.getElementById('msg').addEventListener('paste', () => {
      setTimeout(() => {
        if (document.getElementById('msg').value) {
          // Auto-send after paste (optional)
          // send();
        }
      }, 10);
    });
    
    // Fetch messages from relays
    async function fetchMessages() {
      const button = document.getElementById('refreshBtn');
      button.disabled = true;
      button.textContent = '⏳ FETCHING...';
      
      try {
        const relays = [
          'wss://relay.primal.net',  // This one works best
          'wss://relay.damus.io',
          'wss://nos.lol'
        ];
        
        console.log('Fetching messages for public key:', pk);
        console.log('Current timestamp:', Math.floor(Date.now() / 1000));
        console.log('Current time:', new Date().toLocaleString());
        
        // Fetch events where we are tagged or are the author
        // Use a recent timestamp to get newer events
        const since = Math.floor(Date.now() / 1000) - (24 * 60 * 60); // Last 24 hours
        console.log('Fetching events since:', since, new Date(since * 1000).toLocaleString());
        
        const filter = {
          kinds: [31337],
          authors: [pk],
          limit: 100
        };
        
        const taggedFilter = {
          kinds: [31337],
          '#p': [pk],
          limit: 100
        };
        
        // Use the same method as CLI
        const events = await pool.querySync(relays, filter);
        const taggedEvents = await pool.querySync(relays, taggedFilter);
        
        // Combine and deduplicate
        const allEvents = [...events, ...taggedEvents];
        const uniqueEvents = Array.from(new Map(allEvents.map(e => [e.id, e])).values());
        
        console.log('Found events:', uniqueEvents.length);
        console.log('Events:', uniqueEvents.map(e => ({
          id: e.id.slice(0, 8),
          created_at: e.created_at,
          time: new Date(e.created_at * 1000).toLocaleString(),
          content_preview: e.content.slice(0, 20)
        })));
        
        // Sort by timestamp (newest first)
        uniqueEvents.sort((a, b) => b.created_at - a.created_at);
        
        // Display messages
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = '';
        
        if (uniqueEvents.length === 0) {
          messagesDiv.innerHTML = '<div class="message">No messages yet</div>';
        } else {
          for (const event of uniqueEvents) {
            try {
              // Decrypt message
              const otherPubkey = event.pubkey === pk ? 
                (event.tags.find(tag => tag[0] === 'p')?.[1] || pk) : 
                event.pubkey;
              
              const decrypted = await window.NostrTools.nip04.decrypt(sk, otherPubkey, event.content);
              
              // Create message element with better UX
              const messageEl = document.createElement('div');
              messageEl.className = 'message';
              
              // Create header with time
              const headerEl = document.createElement('div');
              headerEl.className = 'message-header';
              
              const timeEl = document.createElement('div');
              timeEl.className = 'message-time';
              const date = new Date(event.created_at * 1000);
              const timeAgo = getTimeAgo(date);
              timeEl.textContent = timeAgo;
              timeEl.title = date.toLocaleString(); // Full date on hover
              
              headerEl.appendChild(timeEl);
              
              // Create content
              const contentEl = document.createElement('div');
              contentEl.className = 'message-content';
              contentEl.textContent = decrypted;
              
              // Create actions container
              const actionsEl = document.createElement('div');
              actionsEl.className = 'message-actions';
              
              // Copy button with icon
              const copyBtn = document.createElement('button');
              copyBtn.className = 'copy-btn';
              copyBtn.innerHTML = '📋 Copy';
              copyBtn.onclick = () => {
                navigator.clipboard.writeText(decrypted).then(() => {
                  copyBtn.classList.add('copied');
                  copyBtn.innerHTML = '✓ Copied';
                  setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = '📋 Copy';
                  }, 2000);
                }).catch(() => {
                  copyBtn.innerHTML = '✗ Failed';
                  setTimeout(() => {
                    copyBtn.innerHTML = '📋 Copy';
                  }, 2000);
                });
              };
              
              actionsEl.appendChild(copyBtn);
              
              messageEl.appendChild(headerEl);
              messageEl.appendChild(contentEl);
              messageEl.appendChild(actionsEl);
              messagesDiv.appendChild(messageEl);
              
            } catch (e) {
              console.warn('Could not decrypt message:', e);
            }
          }
        }
        
      } catch (e) {
        console.error('Error fetching messages:', e);
        document.getElementById('messages').innerHTML = 
          '<div class="message">Error fetching messages</div>';
      }
      
      button.disabled = false;
      button.textContent = '↻ REFRESH MESSAGES';
    }
    
    // PWA Install functionality
    let deferredPrompt;
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installPrompt').style.display = 'block';
    });
    
    document.getElementById('installBtn').onclick = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        if (result.outcome === 'accepted') {
          document.getElementById('installPrompt').style.display = 'none';
        }
        deferredPrompt = null;
      }
    };
    
    document.getElementById('dismissPrompt').onclick = () => {
      document.getElementById('installPrompt').style.display = 'none';
    };
    
    // Hide install prompt if already installed
    window.addEventListener('appinstalled', () => {
      document.getElementById('installPrompt').style.display = 'none';
    });
    
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      // Listen for messages from service worker
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'SW_UPDATE_AVAILABLE') {
          console.log('New version available:', event.data.version);
          // Show subtle update notification
          const updateBanner = document.createElement('div');
          updateBanner.style.cssText = `
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 10000;
            font-size: 14px;
            cursor: pointer;
            animation: slideDown 0.3s ease-out;
          `;
          updateBanner.innerHTML = '✨ New QR sync feature available! Tap to refresh';
          updateBanner.onclick = () => window.location.reload();
          document.body.appendChild(updateBanner);
          
          // Auto-hide after 10 seconds
          setTimeout(() => {
            if (updateBanner.parentNode) {
              updateBanner.style.animation = 'slideUp 0.3s ease-out';
              setTimeout(() => updateBanner.remove(), 300);
            }
          }, 10000);
        }
      });
      
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('SW registered');
          
          // Immediately check for updates
          registration.update();
          
          // Check for updates every 30 seconds
          setInterval(() => {
            registration.update();
          }, 30000);
          
          // Check for updates on focus
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
              registration.update();
            }
          });
          
          // Handle updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('New service worker installed, waiting for activation');
              }
            });
          });
        })
        .catch(error => console.log('SW registration failed:', error));
    }
    
    // Add animation styles
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideDown {
        from { transform: translate(-50%, -100%); opacity: 0; }
        to { transform: translate(-50%, 0); opacity: 1; }
      }
      @keyframes slideUp {
        from { transform: translate(-50%, 0); opacity: 1; }
        to { transform: translate(-50%, -100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
  });
  </script>
</body>
</html>
